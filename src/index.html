<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonrakers Status</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            min-height: 100dvh;
            background: #000000;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        :root {
            --page-padding: clamp(8px, 2vw, 40px);
            --gap: clamp(4px, 1vw, 10px);
            --portrait-card-width: min(
        150px,
        calc((100dvw - (2 * var(--page-padding)) - (6 * var(--gap))) / 7)
    );
        }

        .contracts,
        .crew,
        .ship_parts {
            position: relative;
            min-width: 0;
            min-height: 0;
            display: grid;
            gap: var(--gap);
            justify-content: center;
            align-content: center;
            perspective: 2000px;
            z-index: 3;
        }

        .area-title {
            position: absolute;
            top: 50%;
            left: 0;
            margin: 0;
            color: rgb(240, 218, 249);
            font-size: clamp(0.65rem, 2vw, 1rem);
            font-weight: bold;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transform: translate(-50%, -50%) rotate(-90deg);
            white-space: nowrap;
        }

        .contracts .card,
        .crew .card {
            aspect-ratio: 5 / 7;
            width: var(--portrait-card-width);
            height: auto;
        }

        .ship_parts .card {
            aspect-ratio: 1;
            width: var(--portrait-card-width);
            height: var(--portrait-card-width);
        }


        .contracts {
            grid-area: contracts;
            grid-template-columns: repeat(4, var(--portrait-card-width));
            grid-template-rows: repeat(2, calc(var(--portrait-card-width) * 7 / 5));
        }

        .crew {
            grid-area: crew;
            grid-template-columns: repeat(3, var(--portrait-card-width));
            grid-template-rows: calc(var(--portrait-card-width) * 7 / 5);
        }

        .ship_parts {
            grid-area: ship_parts;
            grid-template-columns: repeat(3, var(--portrait-card-width));
            grid-template-rows: repeat(2, var(--portrait-card-width));
        }


        .card {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            box-sizing: border-box;
            border-radius: clamp(6px, 1.2vw, 18px);
            border: solid 5px hsl(0, 0%, 0%);
            background-image: var(--card-image);
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            /* border-radius: clamp(3px, 0.5vw, 10px); */
            box-shadow: 0 12px 24px -10px rgb(0 0 0 / 50%);
            transition: transform 0.1s ease-out;
        }

        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(var(--card-shine-angle, 10deg), #eeeeee00, #eeeeee00, #eeeeee00, #eeeeee00, #eeeeee00, #fafafa12, #eeeeee00, #eeeeee00, #eeeeee00, #eeeeee00, #eeeeee00);
            background-size: 200% 200%;
            background-position: var(--card-shine-position-x, 50%) var(--card-shine-position-y, 50%);
            z-index: 3;
        }

        .card.interactive {
            cursor: pointer;
            touch-action: manipulation;
        }

        .slot-clear {
            position: absolute;
            top: 5%;
            right: 5px;
            z-index: 2;
            border: 1px solid rgb(255 255 255 / 40%);
            border-radius: 4px;
            padding: 5px 7px;
            color: white;
            background: rgb(0 0 0 / 50%);
            font: inherit;
            font-size: 0.25rem;
            cursor: pointer;
        }

        .mode-status {
            position: fixed;
            z-index: 5;
            top: 8px;
            right: 10px;
            max-width: min(70vw, 260px);
            padding: 6px 9px;
            color: white;
            background: rgb(0 0 0 / 75%);
            font-size: 0.75rem;
            overflow-wrap: anywhere;
        }

        .card-picker {
            width: min(440px, calc(100vw - 32px));
            max-height: min(80dvh, 650px);
            box-sizing: border-box;
            border: 1px solid rgb(255 255 255 / 30%);
            border-radius: 6px;
            padding: 16px;
            color: white;
            background: #101216;
        }

        .card-picker::backdrop {
            background: rgb(0 0 0 / 75%);
        }

        .picker-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .picker-header h2 {
            margin: 0;
            font-size: 1rem;
        }

        .picker-close,
        .picker-option {
            border: 1px solid rgb(255 255 255 / 25%);
            border-radius: 4px;
            color: white;
            background: #222831;
            font: inherit;
            cursor: pointer;
        }

        .picker-close {
            padding: 6px 9px;
        }

        .picker-search {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #747b84;
            border-radius: 4px;
            padding: 9px;
            color: white;
            background: #090a0c;
            font: inherit;
        }

        .picker-options {
            display: grid;
            gap: 5px;
            max-height: 52dvh;
            overflow: auto;
            margin-top: 10px;
        }

        .picker-option {
            min-height: 40px;
            padding: 8px 10px;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .picker-option:hover,
        .picker-close:hover {
            background: #39414b;
        }

        .board {
            position: relative;
            z-index: 2;
            height: 100dvh;
            box-sizing: border-box;
            padding: var(--page-padding);
            display: grid;

            /* Left side is 3 cards wide; right side is 4 cards wide. */
            grid-template-columns: repeat(7, minmax(0, 1fr));

            /* Crew occupies the upper-left; ship parts fill the two lower rows. */
            grid-template-rows: minmax(0, 1fr) repeat(2, minmax(0, 1fr));

            grid-template-areas:
                "crew       crew       crew       contracts contracts contracts contracts"
                "ship_parts ship_parts ship_parts contracts contracts contracts contracts"
                "ship_parts ship_parts ship_parts contracts contracts contracts contracts";

            gap: var(--gap);
        }
            

        .stars, .twinkling {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .stars {
            background: url('./server_images/stars.png') repeat;
            z-index: 0;
        }

        .twinkling {
            background: url('./server_images/twinkling.png') repeat top center;
            animation: move_twinkle 800s linear infinite;
            z-index: 1;
        }

        .board,
        .contracts,
        .crew,
        .ship_parts,
        .card {
            position: relative;
        }

        .stars,
        .twinkling {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            html,
            body {
                height: auto;
                min-height: 100%;
                overflow-x: hidden;
                overflow-y: auto;
            }

            :root {
                --page-padding: 12px;
                --gap: 8px;
                --portrait-card-width: min(105px, calc((100vw - 48px) / 4));
            }

            .board {
                height: auto;
                min-height: 100dvh;
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto;
                grid-template-areas:
                    "crew"
                    "ship_parts"
                    "contracts";
                gap: 20px;
            }

            .area-title {
                position: static;
                grid-column: 1 / -1;
                transform: none;
                white-space: normal;
                font-size: 0.8rem;
            }

            .contracts,
            .crew,
            .ship_parts {
                align-content: start;
            }

            .contracts {
                grid-template-rows: auto repeat(2, calc(var(--portrait-card-width) * 7 / 5));
            }

            .crew {
                grid-template-rows: auto calc(var(--portrait-card-width) * 7 / 5);
            }

            .ship_parts {
                grid-template-rows: auto repeat(2, var(--portrait-card-width));
            }
        }

    @keyframes move_twinkle {
    0% { background-position: 0 0; }
    100% { background-position: -10000px 5000px; }
    }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="twinkling"></div>
    <div class="mode-status" id="modeStatus" aria-live="polite">Connecting...</div>

<div class="board">
    <div class="contracts">
        <h2 class="area-title">Contracts</h2>
        <div class="card" id="contract1" style="--card-image: url('./server_images/current_contract1.jpg'); --card-width: 375; --card-height: 525;"></div>
        <div class="card" id="contract2" style="--card-image: url('./server_images/current_contract2.jpg'); --card-width: 375; --card-height: 525;"></div>
        <div class="card" id="contract3" style="--card-image: url('./server_images/current_contract3.jpg'); --card-width: 375; --card-height: 525;"></div>
        <div class="card" id="contract4" style="--card-image: url('./server_images/current_contract4.jpg'); --card-width: 375; --card-height: 525;"></div>
        <div class="card" id="contract5" style="--card-image: url('./server_images/current_contract5.jpg'); --card-width: 375; --card-height: 525;"></div>
        <div class="card" id="contract6" style="--card-image: url('./server_images/current_contract6.jpg'); --card-width: 375; --card-height: 525;"></div>
        <div class="card" id="contract7" style="--card-image: url('./server_images/current_contract7.jpg'); --card-width: 375; --card-height: 525;"></div>
        <div class="card" id="contract8" style="--card-image: url('./server_images/current_contract8.jpg'); --card-width: 375; --card-height: 525;"></div>
    </div>

    <div class="crew">
        <h2 class="area-title">Crew</h2>
        <div class="card" id="crew1" style="--card-image: url('./server_images/current_crew1.jpg'); --card-width: 375; --card-height: 525;"></div>
        <div class="card" id="crew2" style="--card-image: url('./server_images/current_crew2.jpg'); --card-width: 375; --card-height: 525;"></div>
        <div class="card" id="crew3" style="--card-image: url('./server_images/current_crew3.jpg'); --card-width: 375; --card-height: 525;"></div>
    </div>

    <div class="ship_parts">
        <h2 class="area-title">Ship Parts</h2>
        <div class="card" id="ship_part1" style="--card-image: url('./server_images/current_ship_part1.jpg'); --card-width: 375; --card-height: 375;"></div>
        <div class="card" id="ship_part2" style="--card-image: url('./server_images/current_ship_part2.jpg'); --card-width: 375; --card-height: 375;"></div>
        <div class="card" id="ship_part3" style="--card-image: url('./server_images/current_ship_part3.jpg'); --card-width: 375; --card-height: 375;"></div>
        <div class="card" id="ship_part4" style="--card-image: url('./server_images/current_ship_part4.jpg'); --card-width: 375; --card-height: 375;"></div>
        <div class="card" id="ship_part5" style="--card-image: url('./server_images/current_ship_part5.jpg'); --card-width: 375; --card-height: 375;"></div>
        <div class="card" id="ship_part6" style="--card-image: url('./server_images/current_ship_part6.jpg'); --card-width: 375; --card-height: 375;"></div>
    </div>

</div>

    <dialog class="card-picker" id="cardPicker">
        <div class="picker-header">
            <h2 id="pickerTitle">Select card</h2>
            <button class="picker-close" id="pickerClose" type="button">Close</button>
        </div>
        <input class="picker-search" id="pickerSearch" type="search" placeholder="Search cards" autocomplete="off">
        <div class="picker-options" id="pickerOptions"></div>
    </dialog>

    <script>
        const contract1 =  document.getElementById('contract1');
        const contract2 = document.getElementById('contract2');
        const contract3 = document.getElementById('contract3');
        const contract4 = document.getElementById('contract4');
        const contract5 = document.getElementById('contract5');
        const contract6 = document.getElementById('contract6');
        const contract7 = document.getElementById('contract7');
        const contract8 = document.getElementById('contract8');

        const crew1 =  document.getElementById('crew1');
        const crew2 = document.getElementById('crew2');
        const crew3 = document.getElementById('crew3');
        
        const ship_part1 = document.getElementById('ship_part1');
        const ship_part2 = document.getElementById('ship_part2');
        const ship_part3 = document.getElementById('ship_part3');
        const ship_part4 = document.getElementById('ship_part4');
        const ship_part5 = document.getElementById('ship_part5');
        const ship_part6 = document.getElementById('ship_part6');

        const cards = document.querySelectorAll(".card");

                document.addEventListener("mousemove", (event) => {
            const shine_radius_std = 150;  // px, same falloff radius as the tilt effect

            for (const card of cards) {
                const rect = card.getBoundingClientRect();
                const card_centerX = rect.left + rect.width / 2;
                const card_centerY = rect.top + rect.height / 2;
                const dx = event.clientX - card_centerX;
                const dy = event.clientY - card_centerY;
                const distance = Math.hypot(dx, dy);

                // Gaussian falloff so only nearby cards sweep; far cards rest at center
                const influence = Math.exp(-(distance * distance) / (2 * shine_radius_std * shine_radius_std));

                const rawPercentX = (dx / rect.width) * 1 + 100;
                const rawPercentY = (dy / rect.height) * 10 + 80;
                const percentX = 50 + (rawPercentX - 50) * influence;
                const percentY = 50 + (rawPercentY - 50) * influence;
                const angle = Math.atan2(percentY, percentX)/ Math.PI * 180 + 10;
                
                // const angle = 10;

                card.style.setProperty('--card-shine-position-x', `${percentX}%`);
                card.style.setProperty('--card-shine-position-y', `${percentY}%`);
                card.style.setProperty('--card-shine-angle', `${angle}deg`);
            }
        });

        // 3D Parallax tilt effect on mouse movement
        document.addEventListener("mousemove", (event) => {
            const max_rotate = 15;       // degrees
            const max_translate = 5;    // px
            const radius_std = 150;      // px, controls how far the influence reaches

            for (const card of cards) {
                const rect = card.getBoundingClientRect();
                const card_centerX = rect.left + rect.width / 2;
                const card_centerY = rect.top + rect.height / 2;

                const dx = event.clientX - card_centerX;
                const dy = event.clientY - card_centerY;
                const distance = Math.hypot(dx, dy);

                // Gaussian falloff so only nearby cards react strongly
                const influence = Math.exp(-(distance * distance) / (2 * radius_std * radius_std));

                const percentX = dx / rect.width;
                const percentY = dy / rect.height;

                const rotateX = -percentY * max_rotate * influence;
                const rotateY = percentX * max_rotate * influence;
                const translateX = percentX * max_translate * influence;
                const translateY = percentY * max_translate * influence;

                card.style.transform = `
                    rotateX(${rotateX}deg)
                    rotateY(${rotateY}deg)
                    translateX(${translateX}px)
                    translateY(${translateY}px)
                `;
            }
        });

        const slotBindings = [
            ...Array.from({ length: 8 }, (_, index) => ({
                elementId: `contract${index + 1}`, zone: 'contract_slot_1', slot: index, libraryType: 'contracts',
            })),
            ...Array.from({ length: 3 }, (_, index) => ({
                elementId: `crew${index + 1}`, zone: 'crew_slot_1', slot: index, libraryType: 'crew',
            })),
            ...Array.from({ length: 6 }, (_, index) => ({
                elementId: `ship_part${index + 1}`, zone: 'ship_part_slot_1', slot: index, libraryType: 'ship_parts',
            })),
        ];
        const modeStatus = document.getElementById('modeStatus');
        const cardPicker = document.getElementById('cardPicker');
        const pickerSearch = document.getElementById('pickerSearch');
        const pickerOptions = document.getElementById('pickerOptions');
        const pickerTitle = document.getElementById('pickerTitle');
        let lastSeenTimestamp = 0;
        let activeMode = 'detect';
        let cardCatalog = {};

        async function fetchBoardState() {
            try {
                const response = await fetch(`/api/state?t=${Date.now()}`, { cache: 'no-store' });
                return response.ok ? await response.json() : null;
            } catch (_) {
                return null;
            }
        }

        function updateCardImages(timestamp) {
            for (let i = 1; i <= 8; i++) {
                document.getElementById(`contract${i}`).style.setProperty('--card-image', `url('./server_images/current_contract${i}.jpg?t=${timestamp}')`);
            }
            for (let i = 1; i <= 3; i++) {
                document.getElementById(`crew${i}`).style.setProperty('--card-image', `url('./server_images/current_crew${i}.jpg?t=${timestamp}')`);
            }
            for (let i = 1; i <= 6; i++) {
                document.getElementById(`ship_part${i}`).style.setProperty('--card-image', `url('./server_images/current_ship_part${i}.jpg?t=${timestamp}')`);
            }
        }

        function cardLabel(cardId) {
            return cardId.replaceAll('_', ' ').replaceAll('-', ' ');
        }

        async function updateSlot(binding, action, cardId = null) {
            modeStatus.textContent = `${activeMode} mode: updating`;
            try {
                const response = await fetch('/api/slot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ zone: binding.zone, slot: binding.slot, action, card_id: cardId }),
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Update failed');
                await pollBoardState();
            } catch (error) {
                modeStatus.textContent = error.message;
            }
        }

        function openCardPicker(binding) {
            const zoneCards = cardCatalog[binding.libraryType] || [];
            pickerTitle.textContent = `Select ${binding.libraryType.replaceAll('_', ' ')}`;
            pickerSearch.value = '';
            pickerOptions.replaceChildren();

            const renderOptions = () => {
                const query = pickerSearch.value.trim().toLowerCase();
                pickerOptions.replaceChildren();
                for (const cardId of zoneCards) {
                    const label = cardLabel(cardId);
                    if (!label.toLowerCase().includes(query)) continue;
                    const option = document.createElement('button');
                    option.type = 'button';
                    option.className = 'picker-option';
                    option.textContent = label;
                    option.addEventListener('click', async () => {
                        cardPicker.close();
                        await updateSlot(binding, 'select', cardId);
                    });
                    pickerOptions.append(option);
                }
                if (!pickerOptions.childElementCount) {
                    const empty = document.createElement('div');
                    empty.textContent = 'No matching cards';
                    pickerOptions.append(empty);
                }
            };

            renderOptions();
            cardPicker.showModal();
            pickerSearch.focus();
            pickerSearch.oninput = renderOptions;
        }

        function configureInteractiveSlots() {
            for (const binding of slotBindings) {
                const card = document.getElementById(binding.elementId);
                if (card.dataset.controlsBound === 'true') continue;
                card.dataset.controlsBound = 'true';
                card.addEventListener('click', () => {
                    if (activeMode === 'manual') openCardPicker(binding);
                    if (activeMode === 'random') updateSlot(binding, 'reroll');
                });
                card.addEventListener('keydown', (event) => {
                    if (event.key !== 'Enter' && event.key !== ' ') return;
                    event.preventDefault();
                    if (activeMode === 'manual') openCardPicker(binding);
                    if (activeMode === 'random') updateSlot(binding, 'reroll');
                });
                const clearButton = document.createElement('button');
                clearButton.type = 'button';
                clearButton.className = 'slot-clear';
                clearButton.textContent = 'Clear';
                clearButton.setAttribute('aria-label', `Clear ${binding.elementId}`);
                clearButton.addEventListener('click', (event) => {
                    event.stopPropagation();
                    updateSlot(binding, 'clear');
                });
                card.append(clearButton);
            }
        }

        async function pollBoardState() {
            const data = await fetchBoardState();
            if (!data || !data.zones) {
                modeStatus.textContent = 'Board server unavailable';
                return;
            }

            activeMode = data.mode;
            cardCatalog = data.catalog || {};
            modeStatus.textContent = `${activeMode[0].toUpperCase()}${activeMode.slice(1)} mode`;
            for (const binding of slotBindings) {
                const card = document.getElementById(binding.elementId);
                const interactive = activeMode === 'manual' || activeMode === 'random';
                card.classList.toggle('interactive', interactive);
                card.setAttribute('aria-label', `${binding.elementId}, ${activeMode} mode`);
                card.tabIndex = interactive ? 0 : -1;
                card.setAttribute('role', interactive ? 'group' : 'img');
                if (interactive) configureInteractiveSlots();
            }

            let maxTimestamp = 0;
            for (const zone of Object.values(data.zones)) {
                if (zone.last_updated && zone.last_updated > maxTimestamp) {
                    maxTimestamp = zone.last_updated;
                }
            }
            if (maxTimestamp > lastSeenTimestamp) {
                lastSeenTimestamp = maxTimestamp;
                updateCardImages(maxTimestamp);
            }
        }

        document.getElementById('pickerClose').addEventListener('click', () => cardPicker.close());
        setInterval(pollBoardState, 1500);
        pollBoardState();
    </script>
</body>
</html>
